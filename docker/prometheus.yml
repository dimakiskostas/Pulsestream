# Prometheus scrape configuration for the `monitoring` compose profile.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: pulsestream-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
