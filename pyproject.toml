[project]
name = "pulsestream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dimakiskostas", email = "costasdhm2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
pulsestream = "pulsestream:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pandera>=0.32.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
